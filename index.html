	<img
	  id="metanova-home-logo"
	  src="./images/metanova_logo.webp"
	  alt="MetaNova"
	  draggable="false"
	>
	<script src="scripts/supportcheck.js"></script>

	<script src="scripts/main.js" type="module"></script>

	<script>
	document.addEventListener("DOMContentLoaded", function () {
		if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
			navigator.serviceWorker.getRegistrations().then((registrations) => {
				registrations.forEach((registration) => registration.update());
			}).catch((err) => {
				console.warn("[MetaNova] service worker update check failed", err);
			});
		}

		const START_RECT = { cx: 0.5, cy: 1046 / 1920, w: 710 / 1080, h: 200 / 1920 };
		const OPTION_HOME_RECT = { cx: 0.5, cy: 1038 / 1920, w: 460 / 1080, h: 162 / 1920 };
		const GAMEOVER_HOME_RECT = { cx: 415 / 1080, cy: 1275 / 1920, w: 210 / 1080, h: 215 / 1920 };

		let metanovaGameStarted = false;
		let metanovaLastActivationMs = 0;

		function getMetaNovaLogo() {
			return document.getElementById("metanova-home-logo");
		}

		function showMetaNovaLogo() {
			const logo = getMetaNovaLogo();

			if (!logo || metanovaGameStarted) {
				return;
			}

			document.body.classList.remove("metanova-gameplay-active");
			logo.classList.add("metanova-visible");

			console.log("[MetaNova] shown", {
				src: logo.currentSrc || logo.src,
				display: getComputedStyle(logo).display,
				visibility: getComputedStyle(logo).visibility,
				opacity: getComputedStyle(logo).opacity
			});
		}

		function hideMetaNovaLogo() {
			const logo = getMetaNovaLogo();

			if (!logo) {
				return;
			}

			logo.classList.remove("metanova-visible");
			document.body.classList.add("metanova-gameplay-active");

			console.log("[MetaNova] hidden");
		}

		function getEventPoint(event) {
			if (event && typeof event.clientX === "number" && typeof event.clientY === "number") {
				return { x: event.clientX, y: event.clientY };
			}

			if (event && event.touches && event.touches.length > 0) {
				return { x: event.touches[0].clientX, y: event.touches[0].clientY };
			}

			if (event && event.changedTouches && event.changedTouches.length > 0) {
				return { x: event.changedTouches[0].clientX, y: event.changedTouches[0].clientY };
			}

			return null;
		}

		function isPointInRect(point, rect) {
			if (!point) {
				return false;
			}

			const canvas = window.c3canvas || document.querySelector("canvas");
			const bounds = canvas ? canvas.getBoundingClientRect() : {
				left: 0,
				top: 0,
				width: window.innerWidth,
				height: window.innerHeight
			};
			const cx = bounds.left + (bounds.width * rect.cx);
			const cy = bounds.top + (bounds.height * rect.cy);
			const halfW = (bounds.width * rect.w) / 2;
			const halfH = (bounds.height * rect.h) / 2;

			return point.x >= cx - halfW && point.x <= cx + halfW && point.y >= cy - halfH && point.y <= cy + halfH;
		}

		function shouldDebounceActivation() {
			const now = Date.now();
			if (now - metanovaLastActivationMs < 500) {
				return true;
			}

			metanovaLastActivationMs = now;
			return false;
		}

		function handleMetaNovaInput(event) {
			const point = getEventPoint(event);
			if (!point || shouldDebounceActivation()) {
				return;
			}

			if (!metanovaGameStarted && isPointInRect(point, START_RECT)) {
				metanovaGameStarted = true;
				hideMetaNovaLogo();
				return;
			}

			if (metanovaGameStarted && (isPointInRect(point, OPTION_HOME_RECT) || isPointInRect(point, GAMEOVER_HOME_RECT))) {
				metanovaGameStarted = false;
				document.body.classList.remove("metanova-gameplay-active");

				setTimeout(showMetaNovaLogo, 500);
			}
		}

		function setupMetaNovaDebugPanel() {
			const rawQuery = window.location.search.replace(/^\?/, "");
			if (rawQuery !== "metanovadebug=1") {
				return;
			}

			const panel = document.createElement("div");
			panel.id = "metanova-debug-panel";
			document.body.appendChild(panel);

			window.setInterval(function () {
				const logo = getMetaNovaLogo();
				const style = logo ? getComputedStyle(logo) : null;
				panel.textContent = [
					"[MetaNova Debug]",
					"logo element exists: " + (!!logo),
					"image complete: " + (logo ? logo.complete : false),
					"naturalWidth: " + (logo ? logo.naturalWidth : 0),
					"naturalHeight: " + (logo ? logo.naturalHeight : 0),
					"image src: " + (logo ? (logo.currentSrc || logo.src) : ""),
					"gameStarted: " + metanovaGameStarted,
					"display: " + (style ? style.display : ""),
					"visibility: " + (style ? style.visibility : ""),
					"opacity: " + (style ? style.opacity : ""),
					"z-index: " + (style ? style.zIndex : ""),
					"body gameplay class: " + document.body.classList.contains("metanova-gameplay-active")
				].join("\n");
			}, 300);
		}

		const logo = getMetaNovaLogo();
		if (!logo) {
			return;
		}

		logo.addEventListener("load", () => {
			console.log("[MetaNova] image loaded", logo.currentSrc || logo.src);

			if (!metanovaGameStarted) {
				setTimeout(showMetaNovaLogo, 1200);
			}
		});

		logo.addEventListener("error", () => {
			console.error("[MetaNova] image failed", logo.currentSrc || logo.src);
		});

		if (logo.complete && logo.naturalWidth > 0) {
			setTimeout(showMetaNovaLogo, 1200);
		}

		window.addEventListener("load", () => {
			setTimeout(() => {
				if (!metanovaGameStarted) {
					showMetaNovaLogo();
				}
			}, 2500);
		});

		document.addEventListener("pointerdown", handleMetaNovaInput, true);
		document.addEventListener("touchstart", handleMetaNovaInput, { capture: true, passive: true });
		document.addEventListener("click", handleMetaNovaInput, true);

		hideMetaNovaLogo();
		setupMetaNovaDebugPanel();
	});
	</script>
